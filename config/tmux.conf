# CSM-owned tmux integration. Personal presentation, navigation, clipboard
# behavior, plugins, and host defaults belong to dotfiles.

# Server-side commands do not run through the login shell. CSM owns only the
# PATH entries required to resolve its own Bun-backed executable.
if-shell 'test "$(uname -s)" = Darwin' \
  'set-environment -gF PATH "/opt/homebrew/bin:#{HOME}/.bun/bin:#{HOME}/.local/bin:/usr/local/bin:/usr/bin:/bin"' \
  'set-environment -gF PATH "#{HOME}/.bun/bin:#{HOME}/.local/bin:/usr/local/bin:/usr/bin:/bin"'

# CSM popup and attention navigation.
bind-key a run-shell 'tmux set-environment CSM_FOCUS_PANE "#{pane_id}"' \; display-popup -E -w 90% -h 85% csm
bind-key C-a run-shell 'csm next'

# Expose a composable status segment. The personal tmux profile decides where
# it appears instead of CSM replacing the entire status bar.
set -g status-interval 3
set -g @csm_status '#[fg=#FFFFFF]#(csm status)#[default]'

# CSM owns only its save/restore hooks. Plugin installation and lifecycle are
# supplied by the host's dotfiles profile.
set -g @resurrect-hook-post-save-all 'csm save-sessions'
set -g @resurrect-hook-post-restore-all 'csm restore-sessions'
