# CSM-owned tmux integration. Installed by `csm setup` on every host and sourced
# from ~/.tmux.conf. Keep personal presentation/navigation in dotfiles; this file
# owns only behavior required by CSM, remote transport, and session persistence.

# Server-side commands do not run through the login shell. Use a portable PATH so
# status hooks and persistence commands resolve on both macOS and Linux.
if-shell 'test "$(uname -s)" = Darwin' \
  'set-environment -gF PATH "/opt/homebrew/bin:#{HOME}/.bun/bin:#{HOME}/.local/bin:/usr/local/bin:/usr/bin:/bin"' \
  'set-environment -gF PATH "#{HOME}/.bun/bin:#{HOME}/.local/bin:/usr/local/bin:/usr/bin:/bin"'

# Remote terminal responsiveness and resize behavior. `window-size largest`
# prevents a stale/phone client from collapsing the shared Linux layout.
if-shell 'test "$(uname -s)" != Darwin' 'set-option -s escape-time 10' ''
if-shell 'test "$(uname -s)" != Darwin' 'set-option -g window-size largest' ''

# A fresh Linux CSM host has no personal dotfiles. Supply a small, predictable
# tmux baseline there; macOS keeps these preferences in its dotfiles.
if-shell 'test "$(uname -s)" != Darwin' 'set-option -g prefix C-a' ''
if-shell 'test "$(uname -s)" != Darwin' 'set-option -g mouse on' ''
if-shell 'test "$(uname -s)" != Darwin' 'set-option -g default-terminal tmux-256color' ''
if-shell 'test "$(uname -s)" != Darwin' 'set-window-option -g mode-keys vi' ''
if-shell 'test "$(uname -s)" != Darwin' 'set-option -g base-index 1' ''
if-shell 'test "$(uname -s)" != Darwin' 'set-window-option -g pane-base-index 1' ''
if-shell 'test "$(uname -s)" != Darwin' 'set-option -g renumber-windows on' ''
if-shell 'test "$(uname -s)" != Darwin' 'set-option -g focus-events on' ''
if-shell 'test "$(uname -s)" != Darwin' 'bind-key -r h select-pane -L' ''
if-shell 'test "$(uname -s)" != Darwin' 'bind-key -r j select-pane -D' ''
if-shell 'test "$(uname -s)" != Darwin' 'bind-key -r k select-pane -U' ''
if-shell 'test "$(uname -s)" != Darwin' 'bind-key -r l select-pane -R' ''
if-shell 'test "$(uname -s)" != Darwin' 'bind-key c new-window -c "#{pane_current_path}"' ''

# Clipboard: host-to-remote paste is ordinary terminal input; VM-to-host copy is
# OSC 52. tmux 3.4 lacks get-clipboard, so feature-detect it.
set -s set-clipboard on
set -g allow-passthrough on
if-shell 'tmux show-options -sv get-clipboard >/dev/null 2>&1' 'set -sg get-clipboard both' ''
bind-key ] paste-buffer -p

# Mosh 1.4 only forwards OSC 52 writes that explicitly target the `c` clipboard.
# tmux 3.4 also requires the unused selector parameter to be consumed. Its own
# copy-mode write can still be lost, so pipe mouse selections into an explicit
# OSC 52 write to the client TTY; copy-pipe also retains tmux's paste buffer.
# Keep the Mac binding and any personal terminal overrides unchanged.
if-shell 'test "$(uname -s)" != Darwin' {
  set-option -s terminal-overrides 'xterm-256color:Ms=\E]52;c%p1%.0s;%p2%s\7'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "sh -c 'b64=\$(dd bs=1 count=72000 status=none | base64 | tr -d \"\n\"); printf \"\033]52;c;%s\a\" \"\$b64\" > \"\$1\"' sh #{client_tty}"
}

# CSM popup and attention navigation.
bind-key a run-shell 'tmux set-environment CSM_FOCUS_PANE "#{pane_id}"' \; display-popup -E -w 90% -h 85% csm
bind-key C-a run-shell 'csm next'

# Status/notification engine. On a detached Linux server, csm-monitor.service
# mirrors these ticks; while attached, status-right is the live driver.
set -g status-interval 3
if-shell 'test "$(uname -s)" = Darwin' \
  'set-option -g status-right "#(csm status) #{E:@catppuccin_status_session}"' \
  'set-option -g status-right "#(#{HOME}/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#(csm status) #{E:@catppuccin_status_session}"'
set -g status-right-length 100

# Session persistence. CSM owns mapping restored panes back to their Claude
# session IDs; tmux-resurrect owns layout only and must never spawn `claude`.
set -g @resurrect-hook-post-save-all 'csm save-sessions'
set -g @resurrect-hook-post-restore-all 'csm restore-sessions'
set -g @continuum-save-interval '15'
run-shell 'test -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux && tmux run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux || true'

# Continuum may manage Mac tmux startup. Linux startup belongs exclusively to
# tmux.service; loading the full plugin there can disable that unit.
if-shell 'test "$(uname -s)" = Darwin' \
  'set-option -g @continuum-restore on' \
  'set-option -g @continuum-restore off'
if-shell 'test "$(uname -s)" = Darwin && test -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux' \
  'run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux' ''

# Linux has no Mac dotfiles/theme dependency. Load Catppuccin when provisioned;
# the Mac dotfiles already load it before sourcing this fragment.
if-shell 'test "$(uname -s)" != Darwin && test -f ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux' \
  'run-shell ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux' ''
