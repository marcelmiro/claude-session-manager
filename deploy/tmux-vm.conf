# CSM remote-host tmux settings, sourced from ~/.tmux.conf by deploy/provision.sh.

# Default escape-time is 500ms and delays EVERY Escape keypress — catastrophic in
# vim over SSH, where the sequence can arrive split across packets.
set -sg escape-time 10

# Multiple attached clients (Mac + phone terminal) race SIGWINCH into degenerate
# 145x1 layouts without this.
set -g window-size largest

# OSC 52 clipboard (CSM's Space→c copy): tmux must own the clipboard write and pass
# the wrapped sequence through to the attaching terminal.
set -g set-clipboard on
set -g allow-passthrough on

# The monitor rides status-right: every 3s tick runs `csm status`, which is the
# engine behind ⚡/🔄 prefixes, attention state, and web push on transitions.
# Must be set BEFORE the plugins load — continuum wraps status-right for autosave.
set -g status-interval 3
set -g status-right "#(csm status)"
set -g status-right-length 100

# Session persistence across reboots: resurrect saves/restores layout; the RESTORE
# is triggered by tmux.service's ExecStartPost, NOT continuum — continuum's
# restore-on-server-start races the unit's forking handshake (tmux-continuum #110)
# and kills the server. Continuum here only autosaves every 15 min (riding
# status-right, so the status line must stay on). The csm hooks snapshot the
# pane→session map on save and `claude --resume` each pane after restore. Never put
# claude in @resurrect-processes — csm restore-sessions owns resuming it (ADR 16).
set -g @resurrect-hook-post-save-all 'csm save-sessions'
set -g @resurrect-hook-post-restore-all 'csm restore-sessions'
set -g @continuum-save-interval '15'
run-shell "test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux && tmux run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux || true"
run-shell "test -f ~/.tmux/plugins/tmux-continuum/continuum.tmux && tmux run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux || true"
